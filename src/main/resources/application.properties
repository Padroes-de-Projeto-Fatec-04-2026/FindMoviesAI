spring.application.name=CineMindAI

# Ollama local (100% open source) - requer "ollama serve" rodando e o modelo baixado com "ollama pull llama3.1"
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.1
spring.ai.ollama.chat.options.temperature=0.4

# Fonte de dados de filmes: "memory" (stub embutido, padrao) ou "omdb" (API real https://www.omdbapi.com/)
movie.catalog=${MOVIE_CATALOG:memory}
omdb.base-url=https://www.omdbapi.com/
# Chave gratuita em https://www.omdbapi.com/apikey.aspx - defina a variavel de ambiente OMDB_API_KEY, nao commite a chave
omdb.api-key=${OMDB_API_KEY:}
# Filmes devolvidos por consulta / candidatos inspecionados por recomendacao (cada um custa 1 requisicao)
omdb.max-results=5
omdb.max-candidates=12
